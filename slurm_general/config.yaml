# DEFAULTS #################################################################

executor: slurm
jobs: 10

default-resources:
   - slurm_partition=scavenger
   - slurm_account=biodept
   - ntasks=2
   - cpus_per_task=4
   - mem_per_cpu=100G
   - disk_mb=1000000
   - tmpdir='/scratch/apm58'
   - qos=sbatch
   - runtime=2880
#  - output=slurm-logs/{rule}/{rule}-{wildcards}-%j.out
#  - error=slurm-logs/{rule}/{rule}-{wildcards}-.%j.err
  - mail-user=apm58@duke.edu
  - mail-type=END,FAIL

set-threads:
   - genomescope=8
   - draft_hifiasm=8
   - draft_qc=8
   - purge_dups=8
   - inspector=8
   - ntlink=8
   - kraken=8
   - second_qc=8
   - third_qc=8
set-resources:
   - genomescope:mem_mb=400000
   - draft_hifiasm:mem_mb=400000
   - draft_qc:mem_mb=400000
   - second_qc:mem_mb=400000
   - third_qc:mem_mb=400000
   - purge_dups:mem_mb=400000
   - inspector:mem_mb=400000
   - ntlink:mem_mb=150000
   - kraken:mem_mb=400000

latency-wait: 300
#restart-times: 2
keep-going: False
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True

